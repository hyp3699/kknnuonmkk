<script>
const $=s=>document.querySelector(s), LS=localStorage;
const st={site:LS.site||'',cat:'',kw:'',pg:1,pc:1,loading:false,vod:null,from:0,ep:0,px:(LS.pxs||(LS.px==='1'?'auto':'off'))!=='off',dmOn:LS.dm!=='0'};
// 网络断一下（手机切网络/锁屏/服务重启）自动重试 2 次；GET 默认 25 秒超时
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function api(p,o={}){
  const get=!o.method||o.method==='GET';let last;
  for(let i=0;i<(get?3:1);i++){
    if(o.signal&&o.signal.aborted)throw new Error('已取消');
    let ctl=null,tm=0;const opt=Object.assign({},o);
    if(!o.signal){ctl=new AbortController();opt.signal=ctl.signal;tm=setTimeout(()=>ctl.abort(),25000)}
    try{const r=await fetch(p,opt);clearTimeout(tm);
      if(r.status===401){location.reload();throw new Error('login')}
      const tx=await r.text();try{return JSON.parse(tx)}catch(e){throw new Error(r.status>=500?`服务器忙（HTTP ${r.status}）`:'返回内容不对')}}
    catch(e){clearTimeout(tm);last=e;
      if(e.message==='login'||(o.signal&&o.signal.aborted)||!(e instanceof TypeError||e.name==='AbortError'))throw e;
      if(i<2&&get)await sleep(i?2000:800)}}
  throw new Error(last&&last.name==='AbortError'?'连接超时':'网络连接中断');
}
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
// ---------- 视频加密：代理播放时 m3u8/分片都加密（AES-CTR，浏览器 WebCrypto 解密），地址也藏进 token ----------
let ENC={on:false,ok:false},ENCK=null;
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64u=b=>{let s='';new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const encUse=()=>ENC.on&&ENC.ok&&!!ENCK;
const pvOk=()=>!!(navigator.serviceWorker&&navigator.serviceWorker.controller);  // mp4 解密靠 Service Worker
if('serviceWorker' in navigator&&window.isSecureContext)navigator.serviceWorker.register('/pvsw.js').catch(()=>{});
function encBtn(){const b=$('#benc');if(!b)return;b.classList.toggle('on',ENC.on);b.textContent=ENC.on?'加密:开':'加密:关'}
async function encLoad(){try{const r=await api('/api/enc');ENC={on:!!r.on,ok:!!r.ok};
  if(r.key&&window.crypto&&crypto.subtle&&!ENCK)ENCK=await crypto.subtle.importKey('raw',b64d(r.key),{name:'AES-CTR'},false,['encrypt','decrypt'])}catch(e){}encBtn();
  if(PTT)await refreshCdns()}  // /api/enc 换了加密会话：旧票据里的会话已经对不上，刷新一次
const ctrP=n=>{const c=new Uint8Array(16);c.set(n,0);return {name:'AES-CTR',counter:c,length:64}};
async function encTok(u,h){const n=crypto.getRandomValues(new Uint8Array(8));
  const ct=await crypto.subtle.encrypt(ctrP(n),ENCK,new TextEncoder().encode(JSON.stringify({u,h:h||''})));
  const b=new Uint8Array(8+ct.byteLength);b.set(n,0);b.set(new Uint8Array(ct),8);return b64u(b)}
async function encDec(d){const txt=typeof d==='string',b=txt?b64d(d.trim()):new Uint8Array(d);
  const pt=await crypto.subtle.decrypt(ctrP(b.slice(0,8)),ENCK,b.slice(8));return txt?new TextDecoder().decode(pt):pt}
$('#benc').onclick=async()=>{const on=!ENC.on;
  if(on&&!(window.crypto&&crypto.subtle)){alert('这个浏览器不支持解密（要 https 打开），开不了加密');return}
  if(!confirm(on?'开启加密？采集站视频（不管开没开代理，全部经服务器加密播放）和 tgweb 视频都会加密':'关闭加密？'))return;
  try{const r=await post('/api/enc',{on});ENC={on:!!r.on,ok:!!r.ok};if(on&&!r.ok)alert('服务器缺加密组件，采集站加密暂不可用（ys 选 1 更新后就好）；tgweb 已加密')}catch(e){alert('设置失败：'+e.message)}
  encBtn();await refreshCdns();
  if(document.body.classList.contains('tg'))$('#tgf').src='/tg/'};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- 列表 ----------
const NAMES={};let CUR=[];
let TGON=false;
async function loadCfgs(){
  // ?f=1：强制服务器实时探一次 tgweb（服务器只缓存“在运行”，“不在运行”每次都重新探），
  // 不然刚重启/刚更新的那十几秒里，这里拿到的还是缓存的 false，LS.tg 被清成 '0'，选项直接不见了。
  let cs=[];const tq=api('/api/tg/status?f=1').then(d=>!!d.on,()=>false);
  try{cs=await api('/api/configs')}catch(e){}
  TGON=await tq;  // tgweb 在运行才显示
  $('#cfg').innerHTML=cs.map(c=>`<option value="${esc(c.id)}">${esc(c.builtin?'jjoo':c.name)}</option>`).join('')+(TGON?'<option value="__tg">tgweb</option>':'');
  if(!cs.find(c=>c.id===LS.cfg))LS.cfg='jjoo';
  if(!TGON)LS.tg='0';

let lastSaved='';
function histRec(){
  const v=st.vod;if(!v||!v.groups||!v.groups[st.from]||V.currentTime<3)return null;
  const ep=v.groups[st.from].eps[st.ep];
  return {key:v.key,id:String(v.vod_id),site:NAMES[v.key]||'',name:v.vod_name,pic:v.vod_pic||'',f:st.from,e:st.ep,en:v.groups[st.from].eps.length>1?ep.n:'',t:Math.floor(V.currentTime),dur:Math.floor(V.duration||0)||0};
}
function saveHist(beacon){
  const r=histRec();if(!r)return;
  const s=JSON.stringify(r);if(s===lastSaved)return;lastSaved=s;
  LS['h_'+r.key+'_'+r.id]=JSON.stringify({f:r.f,e:r.e,t:r.t});
  if(beacon&&navigator.sendBeacon)navigator.sendBeacon('/api/history',new Blob([s],{type:'application/json'}));
  else post('/api/history',r).catch(()=>{});
}
addEventListener('pagehide',()=>saveHist(true));

async function openVod(key,id){
  const nav=NAV;
  $('#info').innerHTML='<div class="msg">加载中…</div>';$('#froms').innerHTML='';$('#eps').innerHTML='';$('#dtitle').textContent='';$('#epnow').style.display='none';$('#ftit').textContent='';
  let d; try{d=await api(`/api/vod?key=${encodeURIComponent(key)}&ids=${encodeURIComponent(id)}`)}catch(e){}
  if(nav!==NAV)return;  // 加载时已经返回/换了页面
  const v=d&&d.list&&d.list[0];
  if(!v){$('#info').innerHTML='<div class="msg">详情加载失败</div>';return}
  const froms=(v.vod_play_from||'播放').split('$$$'), urls=(v.vod_play_url||'').split('$$$');
  v.groups=froms.map((f,i)=>({f,eps:(urls[i]||'').split('#').filter(Boolean).map((x,j)=>{const k=x.indexOf('$');return k>=0?{n:x.slice(0,k)||`第${j+1}集`,u:x.slice(k+1)}:{n:`第${j+1}集`,u:x}}).filter(e=>d.t4?e.u:/^https?:/.test(e.u))})).filter(g=>g.eps.length);
  v.key=key; v.t4=!!d.t4; st.vod=v;
  $('#dtitle').innerHTML=esc(v.vod_name)+`<span id="src">${esc(siteName(key))}</span>`;
  if(!AUTO.name||nm(AUTO.name)!==nm(v.vod_name))AUTO={name:v.vod_name,keys:new Set()};AUTO.keys.add(key);st.triedF=new Set();
  if(KEEPALT){KEEPALT=false;$('#alt').style.display='block';const a=altFind(v.vod_name);if(!a.subs.includes(renderAlt))a.subs.push(renderAlt);renderAlt()}else $('#alt').style.display='none';
  $('#info').innerHTML=`<h2>${esc(v.vod_name)}</h2><div class="meta">${esc([v.vod_year,v.vod_area,v.type_name,v.vod_remarks].filter(Boolean).join(' · '))}</div>${v.vod_actor?`<div class="meta">${esc(v.vod_actor)}</div>`:''}<div class="desc">${esc((v.vod_content||'').replace(/<[^>]+>/g,''))}</div>`;
  if(!v.groups.length){$('#eps').innerHTML='<div class="msg">没有可播放的地址</div>';fail('这个站没有可播放的地址');return}
  // 优先 m3u8 线路；恢复上次进度
  // 播放记录按片名合并：别的配置/采集站看过的，换到这里按集名接着播
  let saved=null,same=true;try{const r=await api(`/api/history?key=${encodeURIComponent(key)}&id=${encodeURIComponent(id)}&name=${encodeURIComponent(v.vod_name)}`);if(r){same=r.key===key&&String(r.id)===String(id);saved={f:r.f,e:r.e,t:r.t,en:r.en}}}catch(e){}
  if(nav!==NAV)return;
  if(CARRY&&nm(CARRY.name)===nm(v.vod_name)){saved={f:CARRY.f,e:CARRY.e,t:CARRY.t,en:CARRY.en};same=false}  // 换源：接着刚才那集和进度
  CARRY=null;
  if(!saved)saved=JSON.parse(LS['h_'+key+'_'+id]||'null');
  let fi=v.groups.findIndex(g=>/m3u8/i.test(g.f)||/\.m3u8/i.test(g.eps[0].u)); if(fi<0) fi=0;
  if(saved&&same&&v.groups[saved.f]) fi=saved.f;
  let ei=0;
  if(saved){const eps=v.groups[fi].eps;
    if(same&&saved.f===fi)ei=Math.min(saved.e||0,eps.length-1);
    else if(!same){const num=t=>{const m=String(t||'').match(/\d+/);return m?+m[0]:null},sn=num(saved.en);let j=saved.en?eps.findIndex(x=>x.n===saved.en):-1;if(j<0&&sn!=null)j=eps.findIndex(x=>num(x.n)===sn);ei=j>=0?j:Math.min(saved.e||0,eps.length-1)}}
  if(saved&&!same)setSt('已接上其他站的播放记录');
  renderFroms(fi); play(fi,ei,saved&&(same?saved.f===fi:true)?saved.t:0);
}
function renderFroms(fi){
  const eps=st.vod.groups[fi].eps,rev=LS.erev==='1';
  $('#froms').innerHTML=(st.vod.groups.length>1?st.vod.groups.map((g,i)=>`<button data-i="${i}" class="${i===fi?'on':''}">${esc(g.f)}</button>`).join(''):'')+
    (eps.length>1?`<button id="erev" style="margin-left:auto">${rev?'正序':'倒序'}</button>`:'');
  const idx=eps.map((e,i)=>i);if(rev)idx.reverse();  // 倒序只改显示顺序，data-i 还是原来的集号
  $('#eps').innerHTML=idx.map(i=>`<button data-i="${i}" title="${esc(eps[i].n)}" class="${i===st.ep&&fi===st.from?'on':''}">${esc(eps[i].n)}</button>`).join('');
}

const nm=t=>String(t||'').toLowerCase().replace(/[\s\p{P}\p{S}]/gu,'');
const siteName=k=>NAMES[k]||String(k).replace(/^c\d+:/,'');
let CARRY=null,KEEPALT=false,ALT=null, ALTS=new Map(), AUTO={name:'',keys:new Set()};
$('#bauto').classList.toggle('on',LS.auto!=='0');

function altFind(name){  // 结果按 配置+片名 保留（内存 + 服务器 /api/altcache），边搜边出
  const k=nm(name),ck='cfg:'+(LS.cfg||'jjoo')+'#'+k;
  if(ALT&&ALT.ck===ck)return ALT;
  let c=ALTS.get(ck);if(c){ALT=c;return c}
  const a=ALT={name,list:[],done:false,n:CUR.length,cnt:0,subs:[],ck,load:true};ALTS.set(ck,a);
  const tell=()=>a.subs.forEach(f=>f());
  let svT=0;const save=now=>{if(!now&&svT)return;clearTimeout(svT);svT=0;const f=()=>post('/api/altcache',{ck,name,n:a.n,cnt:a.cnt,list:a.list}).catch(()=>{});if(now)f();else svT=setTimeout(()=>{svT=0;f()},800)};
  a.save=save;a.pend=()=>!a.done&&!a.stop&&a.list.length?['/api/altcache',{ck,name,n:a.n,cnt:a.cnt,list:a.list}]:null;
  const search=()=>{const q=CUR.slice();
    const worker=async()=>{while(q.length&&ALTS.get(ck)===a&&!a.stop){const s=q.shift();
      try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),10000);
        const d=await api(`/api/vod?key=${encodeURIComponent(s.key)}&wd=${encodeURIComponent(name)}&pg=1`,{signal:ctl.signal});clearTimeout(tm);
        const v=(d&&d.list||[]).find(x=>nm(x.vod_name)===k);
        if(a.stop)return;
        if(v&&ALTS.get(ck)===a){a.list.push({key:s.key,id:String(v.vod_id),rm:v.vod_remarks||''});save()}}catch(e){}
      a.cnt++;tell()}};
    Promise.all(Array.from({length:8},worker)).then(()=>{if(ALTS.get(ck)!==a||a.stop)return;a.done=true;tell();
      save(true)})};
  api('/api/altcache?ck='+encodeURIComponent(ck)).then(r=>{if(ALTS.get(ck)!==a)return;a.load=false;
    if(r&&Array.isArray(r.list)){a.list=r.list;a.n=r.n||a.n;a.cnt=r.cnt!=null?r.cnt:a.n;a.done=true;if(a.cnt<a.n)a.stop=true;tell()}else search()}).catch(()=>{a.load=false;search()});
  return a;
}
function goSrc(k,id){if(!onVod())return;{const v=st.vod,g=v&&v.groups&&v.groups[st.from],ep=g&&g.eps[st.ep];CARRY=ep?{name:v.vod_name,f:st.from,e:st.ep,en:g.eps.length>1?ep.n:'',t:Math.floor(V.currentTime>3?V.currentTime:(lastT||0))}:null}location.replace(`#/v/${encodeURIComponent(k)}/${encodeURIComponent(id)}`)}
function renderAlt(){const a=ALT,b=$('#alt');if(!a||b.style.display==='none')return;
  b.innerHTML=`<div class="st" style="padding:4px 0">${a.load?'读取保存的结果…':a.stop?`已停止：搜了 ${a.cnt}/${a.n}，找到 ${a.list.length} 个 <a id="altre" style="color:#e50914;margin-left:8px;cursor:pointer">重新搜索</a>`:a.done?`${a.n} 个站里 ${a.list.length} 个有这部 <a id="altre" style="color:#e50914;margin-left:8px;cursor:pointer">重新搜索</a>`:`查找中 ${a.cnt}/${a.n}，找到 ${a.list.length} 个 <a id="altstop" style="color:#e50914;margin-left:8px;cursor:pointer">停止搜索</a>`}</div>`+
    a.list.map(x=>`<div class="si${x.key===st.vod.key?' cur':''}" data-k="${esc(x.key)}" data-id="${esc(x.id)}"><div class="n"><b>${esc(siteName(x.key))}</b><small>${esc(x.rm)}</small></div><div class="r">${x.key===st.vod.key?'当前':(AUTO.keys.has(x.key)?'<span class="bad">已试过</span>':'')}</div></div>`).join('')}
$('#balt').onclick=()=>{const b=$('#alt');if(b.style.display!=='none'){b.style.display='none';return}
  if(!st.vod)return;b.style.display='block';const a=altFind(st.vod.vod_name);if(!a.subs.includes(renderAlt))a.subs.push(renderAlt);renderAlt()};
$('#alt').onclick=e=>{if(e.target.id==='altstop'){const a=ALT;if(a&&!a.done){a.stop=true;a.done=true;renderAlt();if(a.save)a.save(true)}return}
  if(e.target.id==='altre'){const a=ALT;ALTS.delete(a.ck);ALT=null;api('/api/altcache?ck='+encodeURIComponent(a.ck),{method:'DELETE'}).catch(()=>{}).then(()=>{const b=altFind(st.vod.vod_name);b.subs.push(renderAlt);renderAlt()});return}
  const r=e.target.closest('.si');if(!r||r.dataset.k===st.vod.key)return;saveHist();KEEPALT=true;goSrc(r.dataset.k,r.dataset.id)};
function fail(msg){
  const vod=st.vod;if(!vod||!onVod())return;
  if(LS.auto==='0'){setSt(msg+'，换个线路或点「换源」试试');return}
  st.triedF.add(st.from);
  const g=vod.groups.findIndex((x,i)=>!st.triedF.has(i));
  if(g>=0){setSt(msg+'，自动换线路…');renderFroms(g);play(g,Math.min(st.ep,vod.groups[g].eps.length-1),lastT);return}
  setSt(msg+'，自动换采集站…');saveHist();
  const a=altFind(vod.vod_name);
  const pick=()=>{if(st.vod!==vod||!onVod())return true;const x=a.list.find(x=>!AUTO.keys.has(x.key));
    if(x){goSrc(x.key,x.id);return true}
    if(a.done){setSt('所有站都播放失败了，换个关键词搜搜');return true}
    setSt(`${msg}，正在找其它站 ${a.cnt}/${a.n}…`);return false};

  catch(e){if(tok===dmTok)$('#bdm').textContent='无弹幕'}
}
function seekDm(){box.innerHTML='';lanes=[];FIXT=[];FIXB=[];const t=V.currentTime+(DMC.off||0);dmi=0;while(dmi<DM.length&&DM[dmi][0]<t)dmi++}
V.addEventListener('seeked',seekDm);
V.addEventListener('ratechange',seekDm);  // 倍速：清屏重排，避免新旧速度不同撞在一起
let PT=0;  // 暂停期间弹幕不动，恢复后把各行的占用时间顺延，避免新弹幕叠到停住的弹幕上
V.addEventListener('pause',()=>{box.classList.add('paused');PT=performance.now()});
V.addEventListener('play',()=>{box.classList.remove('paused');if(!PT)return;const dt=performance.now()-PT;PT=0;
  lanes.forEach(L=>{if(L){L.free+=dt;L.end+=dt}});[FIXT,FIXB].forEach(a=>a.forEach((x,i)=>a[i]=x+dt))});
function shoot(d){
  if(box.childElementCount>=DMC.max)return;
  if((d[1]===4&&!DMC.bot)||(d[1]===5&&!DMC.top))return;
  const W=box.clientWidth,H=box.clientHeight,fs=Math.max(15,Math.min(24,W/32))*DMC.fs/100,lh=fs+6,n=Math.max(1,Math.floor(H*DMC.area/100/lh));
  const el=document.createElement('div');el.textContent=d[3];el.style.fontSize=fs+'px';el.style.lineHeight=lh+'px';
  el.style.color=DMC.color?'#'+(d[2]>>>0).toString(16).padStart(6,'0').slice(-6):'#fff';
  const now=performance.now();
  if(d[1]===4||d[1]===5){ // 顶部/底部固定
    el.style.left='50%';el.style.transform='translateX(-50%)';
    const fx=d[1]===5?FIXT:FIXB,life=4000/(V.playbackRate||1);let k=-1;
    for(let i=0;i<Math.max(1,Math.min(n,6));i++)if((fx[i]||0)<=now){k=i;break}
    if(k<0)return;  // 固定弹幕位置都占满了：这条不显示，免得叠在一起
    fx[k]=now+life;el.style[d[1]===5?'top':'bottom']=k*lh+4+'px';
    box.appendChild(el);setTimeout(()=>el.remove(),life);return}
  // 滚动弹幕：只放进不会撞上前一条的行；都满了就丢掉这条（不重叠）
  el.style.visibility='hidden';box.appendChild(el);
  const w=el.offsetWidth,dur=8000*100/DMC.sp/(V.playbackRate||1),sp=(W+w)/dur;
  let li=-1;for(let i=0;i<n;i++){const L=lanes[i];
    if(!L){li=i;break}
    if(now<L.free)continue;  // 上一条尾巴还没完全进屏
    if(sp>L.sp&&now+W/sp<L.end)continue;  // 这条更快，会在屏幕里追上上一条
    li=i;break}
  if(li<0){el.remove();return}
  el.style.visibility='';
  lanes[li]={free:now+(w+24)/sp,end:now+dur,sp};
  el.style.top=li*lh+4+'px';el.style.setProperty('--d',-(W+w)+'px');
  el.style.animation=`fly ${dur}ms linear forwards`;el.onanimationend=()=>el.remove();
}
(function tick(){
  if(st.dmOn&&!V.paused&&DM.length){const t=V.currentTime+(DMC.off||0);
    if(dmi<DM.length&&DM[dmi][0]<t-3)seekDm();
    while(dmi<DM.length&&DM[dmi][0]<=t){shoot(DM[dmi]);dmi++}}
  requestAnimationFrame(tick)})();

init();
(()=>{const h=document.querySelector('#list header'),f=()=>document.documentElement.style.setProperty('--hh',h.offsetHeight+'px');f();addEventListener('resize',f);if(window.ResizeObserver)new ResizeObserver(f).observe(h)})();  // 分类栏粘在顶栏下面
</script>
</body>
