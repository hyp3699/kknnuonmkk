<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>哈哈影视</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111;color:#eee;font:14px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:10;background:#1a1a1a;padding:8px;display:flex;gap:6px;align-items:center}
select,input,button{font:inherit;color:#eee;background:#2a2a2a;border:1px solid #333;border-radius:8px;padding:7px 9px}
select{max-width:38%;min-width:0}
#cfg{max-width:28%}
#site{flex:0 0 29%;max-width:29%;text-overflow:ellipsis}
header button{white-space:nowrap;flex:none}
.qh{font-size:13px;color:#aaa;padding:10px 10px 0;display:flex;justify-content:space-between}
input{flex:1;min-width:0}
button{cursor:pointer}
button.on{background:#e50914;border-color:#e50914}
#bpx.auto:not(.on){border:1px dashed #e50914;color:#f88}
#cats{display:flex;gap:6px;overflow-x:auto;padding:8px;background:#151515;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
#cats button{white-space:nowrap;padding:5px 11px;border-radius:14px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;padding:10px}
.card{position:relative;cursor:pointer}
.card .pic{width:100%;aspect-ratio:3/4;background:#222 center/cover no-repeat;border-radius:8px}
.card .rm{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);font-size:11px;padding:1px 5px;border-radius:4px;max-width:90%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card .nm{margin-top:4px;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;padding:10px}
.card .x{position:absolute;top:2px;left:2px;width:24px;height:24px;line-height:22px;text-align:center;border-radius:12px;background:rgba(0,0,0,.65);font-size:16px}
.card .pg{height:3px;background:#333;border-radius:2px;margin-top:3px;overflow:hidden}.card .pg i{display:block;height:100%;background:#e50914}
.card .sub{font-size:11px;color:#999;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sbox{padding:10px}.srow{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.srow input{flex:1;min-width:140px}
.st{color:#888;font-size:12px;flex:1;min-width:100px}
.si{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid #222}
.si .n{flex:1;min-width:0}.si .n b{display:block;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.si .n small{display:block;color:#777;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.si .r{font-size:12px;max-width:38%;text-align:right}.ok{color:#4caf50}.bad{color:#f55}.warn{color:#e6a23c}
.si button{padding:5px 8px;font-size:12px}
#nlink{width:100%;height:64px;font:12px/1.4 monospace;color:#ddd;background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:8px}#nodebox{border-top:1px solid #222}
#npop{position:fixed;top:52px;right:8px;z-index:50;width:min(340px,94vw);max-height:70vh;overflow:auto;background:#181818;border:1px solid #333;border-radius:10px;box-shadow:0 6px 24px #000a}
#npop .si{cursor:pointer}#npop .si.cur b{color:#e50914}#bnode.on{border-color:#e50914}
#raw{width:100%;height:70vh;font:12px/1.4 monospace;color:#ddd;background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:8px}
#more,.msg{text-align:center;padding:14px;color:#888}
#detail{display:none;padding-bottom:30px}
#box{position:relative;background:#000;width:100%;aspect-ratio:16/9;overflow:hidden}
#box video{width:100%;height:100%;display:block;background:#000}
#dm{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#dm div{position:absolute;white-space:nowrap;font-size:20px;font-weight:600;text-shadow:1px 1px 2px #000,0 0 1px #000;will-change:transform;left:100%}
#dm.paused div{animation-play-state:paused!important}
#dm.off{display:none}
@keyframes fly{from{transform:translateX(0)}to{transform:translateX(var(--d))}}
#box:fullscreen{aspect-ratio:auto;height:100%}
#bar{display:grid;grid-template-columns:repeat(3,1fr) 78px;grid-template-rows:36px 36px;gap:6px;padding:8px}
#bar #bfs{grid-column:4;grid-row:1/3;width:78px;height:78px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;border:0;border-radius:14px;color:#fff;background:linear-gradient(145deg,#ff3b47,#b0060f);box-shadow:0 3px 10px #e5091455}
#bar #bfs:active{transform:scale(.95)}
#bar button{height:36px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
#st{color:#888;font-size:12px;min-height:16px}
#gest{position:absolute;left:0;right:0;top:0;bottom:56px;z-index:2;touch-action:none}
#ov{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);z-index:3;display:flex;gap:12px;align-items:center;pointer-events:none;opacity:0;transition:opacity .2s}
#box:not(:fullscreen) #ov,#box:not(:fullscreen) #selp{display:none!important}
#box.ui #ov,#box.ui #ofs{opacity:1}#box.ui #ov button,#box.ui #ofs{pointer-events:auto}
#ov button{background:#0009;border:0;border-radius:50%;width:42px;height:42px;font-size:18px;padding:0}
#ov #osel{border-radius:18px;width:auto;height:38px;padding:0 16px;font-size:14px}
#ofs{position:absolute;top:8px;right:8px;z-index:3;background:#0009;border:0;border-radius:8px;width:40px;height:36px;font-size:20px;padding:0;opacity:0;pointer-events:none;transition:opacity .2s}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:4;background:#000b;padding:6px 14px;border-radius:16px;font-size:14px;display:none;pointer-events:none}
#selp{position:absolute;top:0;right:0;bottom:0;width:min(320px,70%);z-index:5;background:#111e;display:none;flex-direction:column}
#selp.on{display:flex}#selp .sh{display:flex;align-items:center;padding:6px 10px}#selp .sh b{flex:1}
#sell{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;padding:6px 10px;align-content:start}
#sell button{padding:7px 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}
.info{padding:0 10px}
.info h2{margin:6px 0;font-size:18px}
.info .meta{color:#999;font-size:12px}
.info .desc{color:#aaa;font-size:13px;max-height:5.6em;overflow:hidden;margin:6px 0}
#alt{padding:4px 10px;display:none}#alt .si{cursor:pointer}#alt .si.cur b{color:#e50914}
#dmset .srow label{width:76px;color:#aaa;font-size:13px}#dmset input[type=range]{flex:1}#dmset .v{width:52px;text-align:right;font-size:12px;color:#ccc}
#src{color:#e6a23c;font-size:12px;margin-left:6px}
#froms{display:flex;gap:6px;overflow-x:auto;padding:6px 10px}
#froms button{white-space:nowrap}
#eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;padding:6px 10px}
#eps button{padding:7px 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="list">
  <header>
    <select id="cfg"></select>
    <select id="site"></select>
    <span style="flex:1"></span>
    <button id="bnode" title="节点切换">🌐</button>
    <button id="bq" title="搜索">🔍</button>
    <button id="bh">记录</button>
    <button id="bset" title="设置">⚙️</button>
  </header>
  <div id="cats"></div>
  <div id="grid"></div>
  <div id="more"></div>
</div>
<div id="npop" class="sbox" style="display:none"></div>
<div id="srch" style="display:none">
  <header><button class="back">‹</button><input id="kw" placeholder="搜索当前配置的全部采集站" enterkeyhint="search"><button id="go">搜索</button></header>
  <div style="display:flex;align-items:center;gap:6px;padding:8px 10px 0"><div class="st" id="qst"></div><button id="qstop" style="display:none;margin-left:auto">停止搜索</button></div>
  <div id="qres"></div>
</div>
<div id="hist" style="display:none">
  <header><button class="back">‹ 返回</button><span style="flex:1">播放记录</span><button id="hclr">清空</button><a href="/logout"><button>退出登录</button></a></header>
  <div id="hgrid"></div>
</div>
<div id="set" style="display:none">
  <header><button class="back">‹ 返回</button><span style="flex:1">设置</span><button id="bnadd">添加节点</button><button id="sraw">编辑 jjoo</button></header>
  <div class="sbox">
    <div class="srow" style="margin-top:8px"><input id="cname" placeholder="名称（可空）" style="flex:0 1 32%"><input id="curl" placeholder="配置地址 http://xxx/tv"><button id="cadd">添加配置</button></div>
    <div class="st" id="cst"></div>
    <div id="clist"></div>
  </div>
  <div class="sbox" id="nodebox" style="display:none">
    <div class="srow"><b style="flex:1">出口节点</b><button id="nclose">收起</button></div>
    <textarea id="nlink" spellcheck="false" placeholder="粘贴节点链接：vless:// vmess:// trojan:// ss:// hy2:// tuic://，可多行或 base64 订阅内容，也可粘贴 sing-box 出站 JSON"></textarea>
    <div class="srow" style="margin-top:6px"><input id="nname" placeholder="名称（可空）"><button id="nadd">添加节点</button></div>
    <div class="st" id="nst"></div>
    <div id="nlist"></div>
  </div>
  <div class="sbox" id="sitebox">
    <div class="srow"><button id="tall">全部测试</button><button id="tdel" disabled>删除失效</button><span class="st" id="sst"></span></div>
    <div id="slist"></div>
  </div>
  <div class="sbox" id="rawbox" style="display:none">
    <div class="srow"><span class="st">直接修改 jjoo.json（保存前会检查格式，自动备份为 jjoo.json.bak）</span><button id="rsave">保存</button><button id="rcancel">取消</button></div>
    <textarea id="raw" spellcheck="false"></textarea>
  </div>
</div>
<div id="detail">
  <header><button id="back">‹ 返回</button><span id="dtitle" style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis"></span></header>
  <div id="box"><video id="v" playsinline webkit-playsinline controls controlslist="nofullscreen" disablepictureinpicture preload="auto"></video><div id="dm"></div>
    <div id="gest"></div>
    <div id="ov"><button id="oprev" title="上一集">⏮</button><button id="osel">选集</button><button id="onext" title="下一集">⏭</button></div>
    <button id="ofs" title="全屏">⛶</button>
    <div id="toast"></div>
    <div id="selp"><div class="sh"><b>选集</b><button id="selx">✕</button></div><div id="sell"></div></div>
  </div>
  <div id="bar">
    <button id="bdm" class="on">弹幕</button>
    <button id="bdms">弹幕设置</button>
    <button id="bpx">代理</button>
    <button id="bfs" title="全屏"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>全屏</span></button>
    <button id="balt">换源</button>
    <button id="bauto">自动换源</button>
    <button id="bbuf">缓冲</button>
  </div>
  <div class="st" id="st" style="padding:0 10px"></div>
  <div id="bufset" class="sbox" style="display:none"></div>
  <div id="alt"></div>
  <div id="dmset" class="sbox" style="display:none"></div>
  <div class="info" id="info"></div>
  <div id="froms"></div>
  <div id="eps"></div>
</div>
<script src="/hls.js"></script>
<script>
const $=s=>document.querySelector(s), LS=localStorage;
const st={site:LS.site||'',cat:'',kw:'',pg:1,pc:1,loading:false,vod:null,from:0,ep:0,px:LS.px==='1',dmOn:LS.dm!=='0'};
// 网络断一下（手机切网络/锁屏/服务重启）自动重试 2 次；GET 默认 25 秒超时
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function api(p,o={}){
  const get=!o.method||o.method==='GET';let last;
  for(let i=0;i<(get?3:1);i++){
    if(o.signal&&o.signal.aborted)throw new Error('已取消');
    let ctl=null,tm=0;const opt=Object.assign({},o);
    if(!o.signal){ctl=new AbortController();opt.signal=ctl.signal;tm=setTimeout(()=>ctl.abort(),25000)}
    try{const r=await fetch(p,opt);clearTimeout(tm);
      if(r.status===401){location.reload();throw new Error('login')}
      const tx=await r.text();try{return JSON.parse(tx)}catch(e){throw new Error(r.status>=500?`服务器忙（HTTP ${r.status}）`:'返回内容不对')}}
    catch(e){clearTimeout(tm);last=e;
      if(e.message==='login'||(o.signal&&o.signal.aborted)||!(e instanceof TypeError||e.name==='AbortError'))throw e;
      if(i<2&&get)await sleep(i?2000:800)}}
  throw new Error(last&&last.name==='AbortError'?'连接超时':'网络连接中断');
}
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- 列表 ----------
const NAMES={};let CUR=[];
async function loadCfgs(){
  let cs=[];try{cs=await api('/api/configs')}catch(e){}
  $('#cfg').innerHTML=cs.map(c=>`<option value="${esc(c.id)}">${esc(c.builtin?'jjoo':c.name)}</option>`).join('');
  if(!cs.find(c=>c.id===LS.cfg))LS.cfg='jjoo';
  $('#cfg').value=LS.cfg;return cs;
}
async function loadSites(){
  $('#site').innerHTML='<option>加载中…</option>';
  let d={sites:[]};try{d=await api('/api/sites?meta=1&cfg='+encodeURIComponent(LS.cfg))}catch(e){}
  CUR=d.sites||[];CUR.forEach(s=>NAMES[s.key]=s.name);
  $('#site').innerHTML=CUR.length?CUR.map(s=>`<option value="${esc(s.key)}">${esc(s.name)}</option>`).join(''):'<option value="">无可用站</option>';
  if(!CUR.find(s=>s.key===st.site)) st.site=CUR[0]?.key||'';
  $('#site').value=st.site;LS.site=st.site;
  if(!CUR.length){$('#cats').innerHTML='';$('#grid').innerHTML='';
    $('#more').textContent=d.err||(d.total?`这个配置共 ${d.total} 个站，都是 OK影视 的 jar 爬虫(type 3)，网页播放器运行不了，只能在 OK影视 里用`:'这个配置没有站');return false}
  return true;
}
async function init(){
  await loadCfgs();
  if(await loadSites()) await loadCats();
  route();
}
$('#cfg').onchange=async()=>{LS.cfg=$('#cfg').value;$('#qres').innerHTML='';if(await loadSites())loadCats()};
async function loadCats(){
  $('#cats').innerHTML='<span class="msg">加载分类…</span>';
  let cls=[];
  try{cls=(await api(`/api/vod?ac=class&key=${encodeURIComponent(st.site)}`)).class||[]}catch(e){}
  st.cat=''; st.kw='';
  $('#cats').innerHTML=`<button data-t="" class="on">最新</button>`+cls.map(c=>`<button data-t="${esc(String(c.type_id))}">${esc(c.type_name)}</button>`).join('');
  reload();
}
function reload(){st.pg=1;st.pc=1;$('#grid').innerHTML='';more()}
async function more(){
  if(st.loading||st.pg>st.pc) return;
  st.loading=true; $('#more').textContent='加载中…';
  try{
    const q=`/api/vod?key=${encodeURIComponent(st.site)}&pg=${st.pg}`+(st.kw?`&wd=${encodeURIComponent(st.kw)}`:'')+(st.cat?`&t=${encodeURIComponent(st.cat)}`:'');
    const d=await api(q);
    if(d.error&&!d.list.length) throw new Error(d.error);
    st.pc=d.pagecount||1; st.pg++;
    $('#grid').insertAdjacentHTML('beforeend',d.list.map(v=>`<div class="card" data-id="${esc(String(v.vod_id))}"><div class="pic" style="background-image:url('${esc(v.vod_pic||'')}')"></div><div class="rm">${esc(v.vod_remarks||'')}</div><div class="nm">${esc(v.vod_name)}</div></div>`).join(''));
    $('#more').textContent=st.pg>st.pc?($('#grid').children.length?'没有更多了':'没有内容，换个分类或站点'):'';
  }catch(e){$('#more').innerHTML=esc((st.kw?'搜索失败：':'加载失败：')+(e.message||''))+' <button id="retry">重试</button> 或换个站';
    const b=$('#retry');if(b)b.onclick=()=>more()}
  st.loading=false;
}
$('#site').onchange=()=>{st.site=LS.site=$('#site').value;loadCats()};
$('#cats').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  $('#cats').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));st.cat=b.dataset.t;st.kw='';reload()};
// ---------- 聚合搜索：当前配置的全部采集站 ----------
let QGEN=0;
async function search(){
  const kw=$('#kw').value.trim();if(!kw)return;$('#kw').blur();
  const gen=++QGEN, q=CUR.map(s=>s);let done=0,hit=0,n=q.length;
  $('#qres').innerHTML='';$('#qst').textContent=n?`搜索中 0/${n}`:'当前配置没有可用站';
  $('#qstop').style.display=n?'':'none';
  $('#qstop').onclick=()=>{if(gen!==QGEN)return;QGEN++;$('#qstop').style.display='none';$('#qst').textContent=`已停止：搜了 ${done}/${n} 个站，${hit} 个站有结果`};
  const worker=async()=>{while(q.length&&gen===QGEN){const s=q.shift();let d=null;
    try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),15000);
      d=await api(`/api/vod?key=${encodeURIComponent(s.key)}&wd=${encodeURIComponent(kw)}&pg=1`,{signal:ctl.signal});clearTimeout(tm)}catch(e){}
    if(gen!==QGEN)return;done++;
    const nk=kw.toLowerCase().replace(/\s+/g,''),L=(d&&d.list||[]).filter(v=>v.vod_name&&v.vod_name.toLowerCase().replace(/\s+/g,'').includes(nk));
    if(L.length){hit++;
      $('#qres').insertAdjacentHTML('beforeend',`<div class="qh"><span>${esc(s.name)}</span><span>${L.length}${d.pagecount>1?'+':''}</span></div><div class="grid2" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;padding:8px 10px">`+
        L.map(v=>`<div class="card" data-k="${esc(s.key)}" data-id="${esc(String(v.vod_id))}"><div class="pic" style="background-image:url('${esc(v.vod_pic||'')}')"></div><div class="rm">${esc(v.vod_remarks||'')}</div><div class="nm">${esc(v.vod_name)}</div></div>`).join('')+'</div>')}
    $('#qst').textContent=done<n?`搜索中 ${done}/${n}，${hit} 个站有结果`:`搜完 ${n} 个站，${hit} 个站有结果`+(hit?'':'，换个关键词试试');if(done>=n)$('#qstop').style.display='none'}};
  await Promise.all(Array.from({length:8},worker));
}
$('#go').onclick=search; $('#kw').onkeydown=e=>{if(e.key==='Enter')search()};
$('#bq').onclick=()=>location.hash='#/q';$('#srch .back').onclick=()=>goBack();
$('#qres').onclick=e=>{const c=e.target.closest('.card');if(c)location.hash=`#/v/${encodeURIComponent(c.dataset.k)}/${encodeURIComponent(c.dataset.id)}`};
$('#grid').onclick=e=>{const c=e.target.closest('.card');if(c)location.hash=`#/v/${encodeURIComponent(st.site)}/${encodeURIComponent(c.dataset.id)}`};
addEventListener('scroll',()=>{if($('#list').style.display!=='none'&&innerHeight+scrollY>document.body.scrollHeight-400)more()});

// ---------- 路由 ----------
let listScroll=0,NAV=0;
const onVod=()=>/^#\/v\//.test(location.hash);
function route(){
  NAV++;
  const m=location.hash.match(/^#\/v\/([^/]+)\/(.+)$/);
  if($('#list').style.display!=='none')listScroll=scrollY;
  ['#list','#hist','#detail','#set','#srch'].forEach(x=>$(x).style.display='none');
  if(m){saveHist();stopPlay();$('#detail').style.display='block';scrollTo(0,0);openVod(decodeURIComponent(m[1]),decodeURIComponent(m[2]))}
  else if(location.hash==='#/q'){saveHist();stopPlay();st.vod=null;ALT=null;$('#srch').style.display='block';if(!$('#qres').children.length)setTimeout(()=>$('#kw').focus(),50)}
  else if(location.hash==='#/s'){saveHist();stopPlay();st.vod=null;ALT=null;$('#set').style.display='block';scrollTo(0,0);loadSet()}
  else if(location.hash==='#/h'){saveHist();stopPlay();st.vod=null;ALT=null;$('#hist').style.display='block';scrollTo(0,0);loadHist()}
  else{saveHist();stopPlay();st.vod=null;ALT=null;$('#list').style.display='block';scrollTo(0,listScroll)}
}
addEventListener('hashchange',route);
// 打开网页时的那一条记录标成 root：在它上面点返回直接回首页，不会退出网页或没反应
if(!history.state)history.replaceState({root:1},'');

async function getNodes(){try{ND=await api('/api/nodes')}catch(e){ND=null}$('#bnode').classList.toggle('on',!!(ND&&ND.mode!=='off'&&ND.nodes.length));return ND}
function nodeStatus(d){const info=[];if(d.nodes.length){if(!d.bin)info.push('<span class="bad">服务器上没有 sing-box，运行 ys 选 1 更新</span>');else if(d.err)info.push(`<span class="bad">${esc(d.err)}</span>`);else info.push(d.running?'<span class="ok">sing-box 运行中</span>':'<span class="warn">sing-box 未运行</span>')}
  if(d.mode==='auto'&&d.hosts&&d.hosts.length)info.push('正在走节点：'+esc(d.hosts.join('、')));return info.join(' · ')}

let lastSaved='';
function histRec(){
  const v=st.vod;if(!v||!v.groups||!v.groups[st.from]||V.currentTime<3)return null;
  const ep=v.groups[st.from].eps[st.ep];
  return {key:v.key,id:String(v.vod_id),site:NAMES[v.key]||'',name:v.vod_name,pic:v.vod_pic||'',f:st.from,e:st.ep,en:v.groups[st.from].eps.length>1?ep.n:'',t:Math.floor(V.currentTime),dur:Math.floor(V.duration||0)||0};
}
function saveHist(beacon){
  const r=histRec();if(!r)return;
  const s=JSON.stringify(r);if(s===lastSaved)return;lastSaved=s;
  LS['h_'+r.key+'_'+r.id]=JSON.stringify({f:r.f,e:r.e,t:r.t});
  if(beacon&&navigator.sendBeacon)navigator.sendBeacon('/api/history',new Blob([s],{type:'application/json'}));
  else post('/api/history',r).catch(()=>{});
}
addEventListener('pagehide',()=>saveHist(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveHist(true)});

// ---------- 详情 / 播放 ----------
async function openVod(key,id){
  const nav=NAV;
  $('#info').innerHTML='<div class="msg">加载中…</div>';$('#froms').innerHTML='';$('#eps').innerHTML='';$('#dtitle').textContent='';
  let d; try{d=await api(`/api/vod?key=${encodeURIComponent(key)}&ids=${encodeURIComponent(id)}`)}catch(e){}
  if(nav!==NAV)return;  // 加载时已经返回/换了页面
  const v=d&&d.list&&d.list[0];
  if(!v){$('#info').innerHTML='<div class="msg">详情加载失败</div>';return}
  const froms=(v.vod_play_from||'播放').split('$$$'), urls=(v.vod_play_url||'').split('$$$');
  v.groups=froms.map((f,i)=>({f,eps:(urls[i]||'').split('#').filter(Boolean).map((x,j)=>{const k=x.indexOf('$');return k>=0?{n:x.slice(0,k)||`第${j+1}集`,u:x.slice(k+1)}:{n:`第${j+1}集`,u:x}}).filter(e=>d.t4?e.u:/^https?:/.test(e.u))})).filter(g=>g.eps.length);
  v.key=key; v.t4=!!d.t4; st.vod=v;
  $('#dtitle').innerHTML=esc(v.vod_name)+`<span id="src">${esc(siteName(key))}</span>`;
  if(!AUTO.name||nm(AUTO.name)!==nm(v.vod_name))AUTO={name:v.vod_name,keys:new Set()};AUTO.keys.add(key);st.triedF=new Set();
  $('#alt').style.display='none';
  $('#info').innerHTML=`<h2>${esc(v.vod_name)}</h2><div class="meta">${esc([v.vod_year,v.vod_area,v.type_name,v.vod_remarks].filter(Boolean).join(' · '))}</div>${v.vod_actor?`<div class="meta">${esc(v.vod_actor)}</div>`:''}<div class="desc">${esc((v.vod_content||'').replace(/<[^>]+>/g,''))}</div>`;
  if(!v.groups.length){$('#eps').innerHTML='<div class="msg">没有可播放的地址</div>';fail('这个站没有可播放的地址');return}
  // 优先 m3u8 线路；恢复上次进度
  // 播放记录按片名合并：别的配置/采集站看过的，换到这里按集名接着播
  let saved=null,same=true;try{const r=await api(`/api/history?key=${encodeURIComponent(key)}&id=${encodeURIComponent(id)}&name=${encodeURIComponent(v.vod_name)}`);if(r){same=r.key===key&&String(r.id)===String(id);saved={f:r.f,e:r.e,t:r.t,en:r.en}}}catch(e){}
  if(nav!==NAV)return;
  if(!saved)saved=JSON.parse(LS['h_'+key+'_'+id]||'null');
  let fi=v.groups.findIndex(g=>/m3u8/i.test(g.f)||/\.m3u8/i.test(g.eps[0].u)); if(fi<0) fi=0;
  if(saved&&same&&v.groups[saved.f]) fi=saved.f;
  let ei=0;
  if(saved){const eps=v.groups[fi].eps;
    if(same&&saved.f===fi)ei=Math.min(saved.e||0,eps.length-1);
    else if(!same){const num=t=>{const m=String(t||'').match(/\d+/);return m?+m[0]:null},sn=num(saved.en);let j=saved.en?eps.findIndex(x=>x.n===saved.en):-1;if(j<0&&sn!=null)j=eps.findIndex(x=>num(x.n)===sn);ei=j>=0?j:Math.min(saved.e||0,eps.length-1)}}
  if(saved&&!same)setSt('已接上其他站的播放记录');
  renderFroms(fi); play(fi,ei,saved&&(same?saved.f===fi:true)?saved.t:0);
}
function renderFroms(fi){
  $('#froms').innerHTML=st.vod.groups.length>1?st.vod.groups.map((g,i)=>`<button data-i="${i}" class="${i===fi?'on':''}">${esc(g.f)}</button>`).join(''):'';
  $('#eps').innerHTML=st.vod.groups[fi].eps.map((e,i)=>`<button data-i="${i}" title="${esc(e.n)}">${esc(e.n)}</button>`).join('');
}
// ---------- 换源：同名视频在当前配置其它采集站 ----------
const nm=t=>String(t||'').toLowerCase().replace(/[\s\p{P}\p{S}]/gu,'');
const siteName=k=>NAMES[k]||String(k).replace(/^c\d+:/,'');
let ALT=null, AUTO={name:'',keys:new Set()};
$('#bauto').classList.toggle('on',LS.auto!=='0');
$('#bauto').onclick=()=>{LS.auto=LS.auto==='0'?'1':'0';$('#bauto').classList.toggle('on',LS.auto!=='0');setSt(LS.auto==='0'?'已关闭自动换源':'已开启：播放失败会自动换线路/采集站')};
function altFind(name){  // 结果缓存，边搜边出
  if(ALT&&nm(ALT.name)===nm(name))return ALT;
  const a=ALT={name,list:[],done:false,n:CUR.length,cnt:0,subs:[]},q=CUR.slice(),k=nm(name);
  const tell=()=>a.subs.forEach(f=>f());
  const worker=async()=>{while(q.length&&ALT===a){const s=q.shift();
    try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),10000);
      const d=await api(`/api/vod?key=${encodeURIComponent(s.key)}&wd=${encodeURIComponent(name)}&pg=1`,{signal:ctl.signal});clearTimeout(tm);
      const v=(d&&d.list||[]).find(x=>nm(x.vod_name)===k);
      if(v&&ALT===a)a.list.push({key:s.key,id:String(v.vod_id),rm:v.vod_remarks||''})}catch(e){}
    a.cnt++;tell()}};
  Promise.all(Array.from({length:8},worker)).then(()=>{a.done=true;tell()});
  return a;
}
function goSrc(k,id){if(!onVod())return;location.replace(`#/v/${encodeURIComponent(k)}/${encodeURIComponent(id)}`)}
function renderAlt(){const a=ALT,b=$('#alt');if(!a||b.style.display==='none')return;
  b.innerHTML=`<div class="st" style="padding:4px 0">${a.done?`${a.n} 个站里 ${a.list.length} 个有这部`:`查找中 ${a.cnt}/${a.n}，找到 ${a.list.length} 个`}</div>`+
    a.list.map(x=>`<div class="si${x.key===st.vod.key?' cur':''}" data-k="${esc(x.key)}" data-id="${esc(x.id)}"><div class="n"><b>${esc(siteName(x.key))}</b><small>${esc(x.rm)}</small></div><div class="r">${x.key===st.vod.key?'当前':(AUTO.keys.has(x.key)?'<span class="bad">已试过</span>':'')}</div></div>`).join('')}
$('#balt').onclick=()=>{const b=$('#alt');if(b.style.display!=='none'){b.style.display='none';return}
  if(!st.vod)return;b.style.display='block';const a=altFind(st.vod.vod_name);if(!a.subs.includes(renderAlt))a.subs.push(renderAlt);renderAlt()};
$('#alt').onclick=e=>{const r=e.target.closest('.si');if(!r||r.dataset.k===st.vod.key)return;saveHist();goSrc(r.dataset.k,r.dataset.id)};
function fail(msg){
  const vod=st.vod;if(!vod||!onVod())return;
  if(LS.auto==='0'){setSt(msg+'，换个线路或点「换源」试试');return}
  st.triedF.add(st.from);
  const g=vod.groups.findIndex((x,i)=>!st.triedF.has(i));
  if(g>=0){setSt(msg+'，自动换线路…');renderFroms(g);play(g,Math.min(st.ep,vod.groups[g].eps.length-1),lastT);return}
  setSt(msg+'，自动换采集站…');saveHist();
  const a=altFind(vod.vod_name);
  const pick=()=>{if(st.vod!==vod||!onVod())return true;const x=a.list.find(x=>!AUTO.keys.has(x.key));
    if(x){goSrc(x.key,x.id);return true}
    if(a.done){setSt('所有站都播放失败了，换个关键词搜搜');return true}
    setSt(`${msg}，正在找其它站 ${a.cnt}/${a.n}…`);return false};
  if(!pick()){const f=()=>{if(pick())a.subs=a.subs.filter(y=>y!==f)};a.subs.push(f)}
}
$('#froms').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;renderFroms(i);play(i,Math.min(st.ep,st.vod.groups[i].eps.length-1),$('#v').currentTime)};
// 点正片/第几集：先全屏（要在点击里同步调用），正在播的这集不重新播，别的集切过去
$('#eps').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;goFs(true);if(i!==st.ep||!V.currentSrc)play(st.from,i,0);else if(V.paused)V.play().catch(()=>{})};

let hls=null, triedPx=false, HDR='';
const V=$('#v');
let LG=0,WDT=0;
function stopPlay(){LG++;clearTimeout(WDT);V.onerror=null;if(hls){hls.destroy();hls=null}V.removeAttribute('src');V.load();dmReset([])}
function setSt(t){$('#st').textContent=t}
function play(fi,ei,t0){
  saveHist();
  st.from=fi;st.ep=ei;triedPx=false;lastT=t0||0;
  $('#eps').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===ei));
  const ep=st.vod.groups[fi].eps[ei]; if(!ep) return;
  if(st.vod.t4){  // T4 接口：先让服务器解析出真实地址
    const vod=st.vod;stopPlay();setSt('解析中…');
    api(`/api/play?key=${encodeURIComponent(vod.key)}&id=${encodeURIComponent(ep.u)}&flag=${encodeURIComponent(vod.groups[fi].f)}`).then(r=>{
      if(st.vod!==vod||st.from!==fi||st.ep!==ei)return;
      if(!r||!r.url){fail((r&&r.error)||'解析失败');return}
      HDR=r.header&&Object.keys(r.header).length?JSON.stringify(r.header):'';load(r.url,t0||0,st.px||!!HDR)}).catch(()=>{if(st.vod===vod&&st.from===fi&&st.ep===ei)fail('解析失败')});
  }else{HDR='';load(ep.u,t0||0,st.px)}
  const isMovie=st.vod.groups[fi].eps.length===1;
  loadDm(st.vod.vod_name,isMovie?'':ep.n);
}
const kindOf=u=>/\.m3u8(\?|#|$)/i.test(u)?'hls':(/\.(mp4|mkv|webm|flv|mov|m4v)(\?|#|$)/i.test(u)?'file':'');
function load(u,t0,px,kind){
  const lg=++LG;clearTimeout(WDT);
  if(hls){hls.destroy();hls=null}
  V.onerror=null;V.onloadedmetadata=null;V.removeAttribute('src');
  const src=px?'/px?u='+encodeURIComponent(u)+(HDR?'&h='+encodeURIComponent(HDR):''):u;
  const why=px?(st.px?'代理':(HDR?'这个站要求走代理':'直连不行，已自动走代理')):'';
  $('#bpx').classList.toggle('auto',px&&!st.px);$('#bpx').textContent=px&&!st.px?'代理(自动)':'代理';
  setSt(px?why+'，连接中…':'连接中…');
  kind=kind||kindOf(u);
  if(!kind){  // 地址看不出类型：让服务器看一眼内容（m3u8 / mp4）
    api(`/api/probe?u=${encodeURIComponent(u)}`+(HDR?'&h='+encodeURIComponent(HDR):'')).then(r=>{if(lg===LG)load(u,t0,px,(r&&r.kind)||'try')}).catch(()=>{if(lg===LG)load(u,t0,px,'try')});
    return}
  const toPx=(t,m)=>{if(!px&&!triedPx){triedPx=true;setSt(m);load(u,t,true,kind==='try'?'':kind);return true}return false};
  WDT=setTimeout(()=>{if(lg!==LG||V.readyState>=1)return;  // 20 秒没连上算失败
    if(!toPx(t0,'直连超时，改用代理…'))fail('连接超时')},20000);
  const start=()=>{if(lg!==LG)return;clearTimeout(WDT);setSt(px?why+'播放':'');if(t0>5)V.currentTime=t0;V.play().catch(()=>{})};
  const asFile=()=>{V.src=src;V.onloadedmetadata=start;
    V.onerror=()=>{if(lg!==LG)return;if(!toPx(lastT||t0,'直连失败，改用代理…'))fail('播放失败')}};
  if(kind!=='file'&&window.Hls&&Hls.isSupported()){
    let netTry=0,medTry=0;
    hls=new Hls({maxBufferLength:bufLen(),maxMaxBufferLength:Math.max(600,bufLen()*2),maxBufferSize:Math.max(60,bufLen())*1e6});const h=hls;
    h.loadSource(src);h.attachMedia(V);
    h.on(Hls.Events.MANIFEST_PARSED,start);
    h.on(Hls.Events.ERROR,(e,d)=>{if(!d.fatal||lg!==LG)return;
      if(kind==='try'&&(d.details===Hls.ErrorDetails.MANIFEST_PARSING_ERROR)){h.destroy();if(hls===h)hls=null;kind='file';asFile();return}  // 不是 m3u8，当普通视频
      if(!toPx(lastT||t0,'直连失败，改用代理…')){
        if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&medTry<3){medTry++;if(medTry===2)h.swapAudioCodec();h.recoverMediaError();return}
        if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&netTry<2&&V.readyState>=1){netTry++;setSt('网络卡了一下，重试中…');setTimeout(()=>{if(lg===LG)h.startLoad(V.currentTime)},1500*netTry);return}
        fail('播放失败')}});
  }else asFile();
}
let lastT=0;
V.addEventListener('timeupdate',()=>{if(V.currentTime>0)lastT=V.currentTime});
V.addEventListener('ended',()=>next());
function next(){const g=st.vod&&st.vod.groups[st.from];if(g&&st.ep+1<g.eps.length)play(st.from,st.ep+1,0)}
// ---------- 播放器框：上一集/下一集/选集、滑动调音量、双击快进快退 ----------
function prev(){if(st.vod&&st.ep>0)play(st.from,st.ep-1,0)}
let OVT=0,TT=0;
// 点画面显示：右上角全屏按钮（一直可用）+ 全屏时底部的 ⏮ 选集 ⏭
const hideOv=()=>$('#box').classList.remove('ui');
function showOv(){$('#box').classList.add('ui');clearTimeout(OVT);OVT=setTimeout(hideOv,3500)}
$('#ofs').onclick=e=>{e.stopPropagation();showOv();goFs(false)};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(TT);TT=setTimeout(()=>e.style.display='none',900)}
$('#ov').onclick=e=>e.stopPropagation();
$('#oprev').onclick=e=>{e.stopPropagation();showOv();if(st.ep>0)prev();else toast('已经是第一集')};
$('#onext').onclick=e=>{e.stopPropagation();showOv();const g=st.vod&&st.vod.groups[st.from];if(g&&st.ep+1<g.eps.length)next();else toast('已经是最后一集')};
function renderSel(){const g=st.vod&&st.vod.groups[st.from];if(!g)return;
  $('#sell').innerHTML=g.eps.map((x,i)=>`<button data-i="${i}" class="${i===st.ep?'on':''}" title="${esc(x.n)}">${esc(x.n)}</button>`).join('');
  const c=$('#sell .on');if(c)c.scrollIntoView({block:'center'})}
$('#osel').onclick=e=>{e.stopPropagation();$('#selp').classList.add('on');renderSel()};
$('#selx').onclick=()=>$('#selp').classList.remove('on');
$('#sell').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('#selp').classList.remove('on');play(st.from,+b.dataset.i,0)};
(()=>{const g=$('#gest');let sx=0,sy=0,sv=1,mv=false,lastTap=0,tapT=0;
  g.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;sv=V.muted?0:V.volume;mv=false},{passive:true});
  g.addEventListener('touchmove',e=>{const t=e.touches[0],dy=sy-t.clientY;if(!mv&&Math.abs(dy)<12)return;mv=true;e.preventDefault();
    const v=Math.min(1,Math.max(0,sv+dy/(g.clientHeight*0.8)));V.muted=false;V.volume=v;toast('音量 '+Math.round(v*100)+'%')},{passive:false});
  const tap=()=>{if($('#box').classList.contains('ui')){hideOv();return}showOv();V.controls=false;V.controls=true};  // 重设 controls 让浏览器底部控制条重新显示
  g.addEventListener('touchend',e=>{if(mv)return;e.preventDefault();tap()});
  g.addEventListener('click',()=>tap());  // 电脑鼠标
})();
// ---------- 缓冲设置（m3u8 有效；mp4 由浏览器自己缓冲） ----------
const BUFS=[[30,'30 秒（默认）'],[60,'1 分钟'],[120,'2 分钟'],[300,'5 分钟'],[600,'10 分钟']];
const bufLen=()=>+LS.buf||30;
function bufPanel(){const p=$('#bufset'),b=bufLen();
  p.innerHTML='<div class="srow"><b style="flex:1">预先缓冲多长时间</b></div><div class="srow" style="flex-wrap:wrap">'+
    BUFS.map(([v,t])=>`<button data-b="${v}" class="${v===b?'on':''}">${t}</button>`).join('')+
    '</div><div class="st">缓冲越长越不容易卡，但更费流量和内存。只对 m3u8 有效，mp4 由浏览器自己决定。</div>'}
$('#bbuf').onclick=()=>{const p=$('#bufset');if(p.style.display==='none'){bufPanel();p.style.display='block'}else p.style.display='none'};
$('#bufset').onclick=e=>{const b=e.target.closest('button[data-b]');if(!b)return;LS.buf=b.dataset.b;
  if(hls){hls.config.maxBufferLength=bufLen();hls.config.maxMaxBufferLength=Math.max(600,bufLen()*2)}
  bufPanel();setSt('缓冲已设为 '+b.textContent)};
setInterval(()=>{if(st.vod&&!V.paused)saveHist()},10000);
V.addEventListener('pause',()=>saveHist());
$('#bpx').classList.toggle('on',st.px);
$('#bpx').onclick=()=>{st.px=!st.px;LS.px=st.px?'1':'0';$('#bpx').classList.toggle('on',st.px);if(st.vod){const ep=st.vod.groups[st.from].eps[st.ep];if(st.vod.t4)play(st.from,st.ep,V.currentTime);else load(ep.u,V.currentTime,st.px)}};
async function goFs(only){const b=$('#box');
  if(document.fullscreenElement){if(!only)document.exitFullscreen();return}
  if(b.requestFullscreen){await b.requestFullscreen().catch(()=>{});try{await screen.orientation.lock('landscape')}catch(e){}}
  else if(V.webkitEnterFullscreen){try{V.webkitEnterFullscreen()}catch(e){}}}
$('#bfs').onclick=()=>goFs(false);
document.addEventListener('fullscreenchange',()=>{$('#ofs').textContent=document.fullscreenElement?'✕':'⛶';if(!document.fullscreenElement)$('#selp').classList.remove('on');showOv()});

// ---------- 弹幕 ----------
let DM=[],dmi=0,lanes=[],dmTok=0;
const box=$('#dm');
box.classList.toggle('off',!st.dmOn);$('#bdm').classList.toggle('on',st.dmOn);
$('#bdm').onclick=()=>{st.dmOn=!st.dmOn;LS.dm=st.dmOn?'1':'0';box.classList.toggle('off',!st.dmOn);$('#bdm').classList.toggle('on',st.dmOn)};
function dmReset(list){DM=list;dmi=0;box.innerHTML='';lanes=[]}
// 弹幕设置（存在本机）
const DMC=Object.assign({area:75,op:100,fs:100,sp:100,max:80,off:0,top:1,bot:1,color:1},JSON.parse(LS.dmc||'{}'));
const DMF=[['area','显示区域',10,100,5,v=>v===100?'全屏':v+'%'],['op','不透明度',10,100,5,v=>v+'%'],['fs','字号',50,200,10,v=>v+'%'],
  ['sp','速度',50,200,10,v=>v+'%'],['max','同屏数量',10,200,10,v=>v+'条'],['off','时间偏移',-30,30,0.5,v=>(v>0?'+':'')+v+'秒']];
function dmApply(){box.style.opacity=DMC.op/100;LS.dmc=JSON.stringify(DMC)}
function dmPanel(){
  $('#dmset').innerHTML=DMF.map(([k,n,a,b,stp,f])=>`<div class="srow"><label>${n}</label><input type="range" data-k="${k}" min="${a}" max="${b}" step="${stp}" value="${DMC[k]}"><span class="v" id="v_${k}">${f(+DMC[k])}</span></div>`).join('')+
    `<div class="srow"><label>显示</label><button data-b="top" class="${DMC.top?'on':''}">顶部弹幕</button><button data-b="bot" class="${DMC.bot?'on':''}">底部弹幕</button><button data-b="color" class="${DMC.color?'on':''}">彩色</button><button id="dmrst" style="margin-left:auto">恢复默认</button></div>`;
}
$('#bdms').onclick=()=>{const p=$('#dmset');if(p.style.display==='none'){dmPanel();p.style.display='block'}else p.style.display='none'};
$('#dmset').oninput=e=>{const k=e.target.dataset.k;if(!k)return;DMC[k]=+e.target.value;$('#v_'+k).textContent=DMF.find(x=>x[0]===k)[5](DMC[k]);dmApply();if(k==='area'||k==='fs')lanes=[];if(k==='off')seekDm()};
$('#dmset').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='dmrst'){for(const k of Object.keys(DMC))delete DMC[k];Object.assign(DMC,{area:75,op:100,fs:100,sp:100,max:80,off:0,top:1,bot:1,color:1});dmApply();dmPanel();seekDm();return}
  const k=b.dataset.b;if(k){DMC[k]=DMC[k]?0:1;b.classList.toggle('on',!!DMC[k]);dmApply()}};
dmApply();
async function loadDm(name,ep){
  const tok=++dmTok;dmReset([]);$('#bdm').textContent='弹幕…';
  try{const d=await api(`/api/dm?name=${encodeURIComponent(name)}&ep=${encodeURIComponent(ep)}`);
    if(tok!==dmTok)return;d.sort((a,b)=>a[0]-b[0]);dmReset(d);seekDm();$('#bdm').textContent=d.length?`弹幕 ${d.length}`:'无弹幕'}
  catch(e){if(tok===dmTok)$('#bdm').textContent='无弹幕'}
}
function seekDm(){box.innerHTML='';lanes=[];const t=V.currentTime+(DMC.off||0);dmi=0;while(dmi<DM.length&&DM[dmi][0]<t)dmi++}
V.addEventListener('seeked',seekDm);
V.addEventListener('ratechange',()=>{lanes=[]});  // 倍速：新弹幕按倍速飞
V.addEventListener('pause',()=>box.classList.add('paused'));
V.addEventListener('play',()=>box.classList.remove('paused'));
function shoot(d){
  if(box.childElementCount>=DMC.max)return;
  if((d[1]===4&&!DMC.bot)||(d[1]===5&&!DMC.top))return;
  const W=box.clientWidth,H=box.clientHeight,fs=Math.max(15,Math.min(24,W/32))*DMC.fs/100,lh=fs+6,n=Math.max(1,Math.floor(H*DMC.area/100/lh));
  const el=document.createElement('div');el.textContent=d[3];el.style.fontSize=fs+'px';
  el.style.color=DMC.color?'#'+(d[2]>>>0).toString(16).padStart(6,'0').slice(-6):'#fff';
  const now=performance.now();
  if(d[1]===4||d[1]===5){ // 顶部/底部固定
    el.style.left='50%';el.style.transform='translateX(-50%)';
    el.style[d[1]===5?'top':'bottom']=(Math.random()*3|0)*lh+4+'px';
    box.appendChild(el);setTimeout(()=>el.remove(),4000/(V.playbackRate||1));return}
  let li=0,best=Infinity;for(let i=0;i<n;i++){const t=lanes[i]||0;if(t<now){li=i;best=-1;break}if(t<best){best=t;li=i}}
  box.appendChild(el);const w=el.offsetWidth,dur=8000*100/DMC.sp/(V.playbackRate||1),sp=(W+w)/dur;
  lanes[li]=now+(w+20)/sp;
  el.style.top=li*lh+4+'px';el.style.setProperty('--d',-(W+w)+'px');
  el.style.animation=`fly ${dur}ms linear forwards`;el.onanimationend=()=>el.remove();
}
(function tick(){
  if(st.dmOn&&!V.paused&&DM.length){const t=V.currentTime+(DMC.off||0);
    if(dmi<DM.length&&DM[dmi][0]<t-3)seekDm();
    while(dmi<DM.length&&DM[dmi][0]<=t){shoot(DM[dmi]);dmi++}}
  requestAnimationFrame(tick)})();

init();
</script>
</body>
</html>
