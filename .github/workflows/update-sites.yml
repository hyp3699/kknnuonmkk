name: 更新采集站

on:
  schedule:
    - cron: "0 20 */2 * *"   # 每 2 天一次，北京时间 04:00
  workflow_dispatch:
    inputs:
      max_new:
        description: "本次最多新增几个站"
        default: "50"

permissions:
  contents: write

concurrency:
  group: update-sites
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 搜索、测试、去重
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_NEW: ${{ github.event.inputs.max_new || '50' }}
        run: python filer/tools/update_sites.py
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add filer/jjoo.json filer/tools/sites_state.json
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "自动更新采集站 $(date -u +%F)"
          git pull --rebase && git push
